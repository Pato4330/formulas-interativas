<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Período do Pêndulo · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Período do Pêndulo",
      descricao: "T = 2π√(L/g). O período depende do comprimento e da gravidade.",
      formula: "T = 2π√(L / g)",
      cor: "#06b6d4",
      sempre: true,
      campos: [
        { chave: "comprimento", rotulo: "Comprimento (L)", cor: "#06b6d4", min: 0.2, max: 5, passo: 0.1, padrao: 1 },
        { chave: "gravidade", rotulo: "Gravidade (g)", cor: "#f59e0b", min: 1.6, max: 24, passo: 0.1, padrao: 9.8 }
      ],
      calcular(estado) { estado.periodo = 2 * Math.PI * Math.sqrt(estado.comprimento / estado.gravidade); },
      textoAoVivo(estado) { return "T = 2π√(" + formatarNumero(estado.comprimento) + "/" + formatarNumero(estado.gravidade) + ") = <b>" + formatarNumero(estado.periodo) + " s</b>"; },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 420");
        const comprimentoPixel = 60 + limitar(estado.comprimento, 0.2, 5) * 50;
        const pivoX = 250, pivoY = 62;
        const angulo = Math.sin(Date.now() / 380) * 0.7;
        const bolaX = pivoX + comprimentoPixel * Math.sin(angulo);
        const bolaY = pivoY + comprimentoPixel * Math.cos(angulo);
        const raioBola = 12 + estado.gravidade * 0.35;
        svg.innerHTML =
          '<line x1="' + (pivoX - 100) + '" y1="' + pivoY + '" x2="' + (pivoX + 100) + '" y2="' + pivoY + '" stroke="#94a3b8" stroke-width="3"/>' +
          '<circle cx="' + pivoX + '" cy="' + pivoY + '" r="6" fill="#e2e8f0"/>' +
          '<line x1="' + pivoX + '" y1="' + pivoY + '" x2="' + bolaX + '" y2="' + bolaY + '" stroke="#06b6d4" stroke-width="3"/>' +
          '<circle cx="' + bolaX + '" cy="' + bolaY + '" r="' + raioBola + '" fill="rgba(6,182,212,0.5)" stroke="#06b6d4" stroke-width="3"/>' +
          '<text x="' + pivoX + '" y="' + (pivoY + comprimentoPixel + 52) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#67e8f9") + ">L = " + formatarNumero(estado.comprimento) + " m</text>" +
          '<text x="' + pivoX + '" y="' + (pivoY + comprimentoPixel + 84) + '" text-anchor="middle" font-size="17" font-weight="800" ' + contornoPreto("#4ade80") + ">T = " + formatarNumero(estado.periodo) + " s</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
