<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Média Ponderada · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Média Ponderada",
      categoria: "Matemática",
      descricao: "M = Σ(v·p)/Σp. Notas com pesos diferentes.",
      formula: "M = (v₁p₁ + v₂p₂) / (p₁ + p₂)",
      cor: "#ec4899",
      sempre: true,
      campos: [
        { chave: "n1", rotulo: "Nota 1", cor: "#3b82f6", min: 0, max: 10, passo: 0.5, padrao: 6 },
        { chave: "n2", rotulo: "Nota 2", cor: "#ec4899", min: 0, max: 10, passo: 0.5, padrao: 8 },
        { chave: "p1", rotulo: "Peso 1", cor: "#60a5fa", min: 1, max: 5, passo: 1, padrao: 2 },
        { chave: "p2", rotulo: "Peso 2", cor: "#f472b6", min: 1, max: 5, passo: 1, padrao: 3 }
      ],
      calcular(estado) { estado.M = (estado.n1 * estado.p1 + estado.n2 * estado.p2) / (estado.p1 + estado.p2); },
      textoAoVivo(estado) {
        return "(" + formatarNumero(estado.n1) + "·" + formatarNumero(estado.p1) + " + " + formatarNumero(estado.n2) + "·" + formatarNumero(estado.p2) + ") / (" + formatarNumero(estado.p1) + "+" + formatarNumero(estado.p2) + ") = <b>" + formatarNumero(estado.M) + "</b>";
      },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 380");
        const tempo = Date.now() / 1000;
        const baseY = 295, alturaMaxima = 215;
        const largura1 = 60 + estado.p1 * 14, largura2 = 60 + estado.p2 * 14;
        const x1 = 120 - largura1 / 2, x2 = 380 - largura2 / 2;
        const altura1 = (estado.n1 / 10) * alturaMaxima, altura2 = (estado.n2 / 10) * alturaMaxima;
        const alturaMedia = (estado.M / 10) * alturaMaxima;
        const mediaY = baseY - alturaMedia;
        const fracao = (Math.sin(tempo * 1.3) + 1) / 2;
        const pontoX = x1 + 14 + fracao * (x2 + largura2 - x1 - 28);
        svg.innerHTML =
          '<rect x="' + x1 + '" y="' + (baseY - altura1) + '" width="' + largura1 + '" height="' + altura1 + '" rx="6" fill="rgba(59,130,246,0.45)" stroke="#3b82f6" stroke-width="2.5"/>' +
          '<text x="120" y="' + (baseY - altura1 - 12) + '" text-anchor="middle" font-size="15" font-weight="800" ' + contornoPreto("#60a5fa") + ">" + formatarNumero(estado.n1) + "</text>" +
          '<text x="120" y="' + (baseY + 24) + '" text-anchor="middle" font-size="12" fill="#94a3b8">peso ' + formatarNumero(estado.p1) + "</text>" +
          '<rect x="' + x2 + '" y="' + (baseY - altura2) + '" width="' + largura2 + '" height="' + altura2 + '" rx="6" fill="rgba(236,72,153,0.45)" stroke="#ec4899" stroke-width="2.5"/>' +
          '<text x="380" y="' + (baseY - altura2 - 12) + '" text-anchor="middle" font-size="15" font-weight="800" ' + contornoPreto("#f9a8d4") + ">" + formatarNumero(estado.n2) + "</text>" +
          '<text x="380" y="' + (baseY + 24) + '" text-anchor="middle" font-size="12" fill="#94a3b8">peso ' + formatarNumero(estado.p2) + "</text>" +
          '<line x1="' + (x1 - 14) + '" y1="' + mediaY + '" x2="' + (x2 + largura2 + 14) + '" y2="' + mediaY + '" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4"/>' +
          '<circle cx="' + pontoX.toFixed(1) + '" cy="' + mediaY + '" r="6" fill="#4ade80" stroke="#0b1020" stroke-width="1.5"/>' +
          '<text x="250" y="' + (mediaY - 10) + '" text-anchor="middle" font-size="13" font-weight="800" ' + contornoPreto("#4ade80") + ">M = " + formatarNumero(estado.M) + "</text>" +
          '<text x="250" y="' + (baseY + 60) + '" text-anchor="middle" font-size="16" font-weight="800" ' + contornoPreto("#4ade80") + ">Média = " + formatarNumero(estado.M) + "</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
