<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porcentagem · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Porcentagem",
      categoria: "Matemática",
      descricao: "Quanto é X% de um valor? A parte é (p/100)·base.",
      formula: "parte = p% de base",
      cor: "#22c55e",
      sempre: true,
      campos: [
        { chave: "base", rotulo: "Valor (base)", cor: "#3b82f6", min: 10, max: 1000, passo: 10, padrao: 200 },
        { chave: "p", rotulo: "Porcentagem (p)", cor: "#22c55e", min: 0, max: 100, passo: 1, padrao: 25 }
      ],
      calcular(estado) { estado.res = (estado.base * estado.p) / 100; },
      textoAoVivo(estado) {
        return '<span class="c">' + formatarNumero(estado.p) + "</span>% de <span class=\"b\">" + formatarNumero(estado.base) + "</span> = <b>" + formatarNumero(estado.res) + "</b>";
      },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 480 300");
        const tempo = Date.now() / 1000;
        const larguraBarra = 400, xInicio = 40, yInicio = 170, alturaBarra = 60;
        const preenchimento = (larguraBarra * limitar(estado.p, 0, 100)) / 100;
        const xBrilho = xInicio + preenchimento * ((tempo * 0.45) % 1);
        svg.innerHTML =
          '<rect x="' + xInicio + '" y="' + yInicio + '" width="' + larguraBarra + '" height="' + alturaBarra + '" rx="12" fill="rgba(255,255,255,0.06)" stroke="#64748b" stroke-width="2"/>' +
          (preenchimento > 0 ? '<rect x="' + xInicio + '" y="' + yInicio + '" width="' + preenchimento + '" height="' + alturaBarra + '" rx="12" fill="rgba(34,197,94,0.55)"/>' : "") +
          (preenchimento > 0 ? '<rect x="' + xBrilho + '" y="' + (yInicio + 6) + '" width="22" height="' + (alturaBarra - 12) + '" rx="8" fill="rgba(255,255,255,0.28)"/>' : "") +
          '<line x1="' + (xInicio + preenchimento) + '" y1="' + (yInicio - 8) + '" x2="' + (xInicio + preenchimento) + '" y2="' + (yInicio + alturaBarra + 8) + '" stroke="#4ade80" stroke-width="2" stroke-dasharray="4 3"/>' +
          '<text x="' + (xInicio + larguraBarra / 2) + '" y="' + (yInicio + alturaBarra / 2 + 6) + '" text-anchor="middle" font-size="15" font-weight="800" ' + contornoPreto("#d1fae5") + ">" + formatarNumero(estado.p) + "% = " + formatarNumero(estado.res) + "</text>" +
          '<text x="' + (xInicio + larguraBarra) + '" y="' + (yInicio + alturaBarra + 30) + '" text-anchor="end" font-size="13" font-weight="700" ' + contornoPreto("#93c5fd") + ">100% = " + formatarNumero(estado.base) + "</text>" +
          '<text x="' + (xInicio + preenchimento) + '" y="' + (yInicio - 14) + '" text-anchor="middle" font-size="13" font-weight="700" ' + contornoPreto("#4ade80") + ">" + formatarNumero(estado.p) + "%</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
