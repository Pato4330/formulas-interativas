<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seno e Cosseno · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Seno e Cosseno",
      categoria: "Matemática",
      descricao: "No triângulo retângulo de hipotenusa 1: sen θ = cateto oposto, cos θ = cateto adjacente.",
      formula: "sen²θ + cos²θ = 1",
      cor: "#3b82f6",
      sempre: true,
      campos: [
        { chave: "ang", rotulo: "Ângulo (θ)", cor: "#3b82f6", min: 1, max: 89, passo: 1, padrao: 30 }
      ],
      calcular(estado) { const anguloRad = (estado.ang * Math.PI) / 180; estado.sin = Math.sin(anguloRad); estado.cos = Math.cos(anguloRad); },
      textoAoVivo(estado) {
        return "sen <span class=\"b\">" + formatarNumero(estado.ang) + "°</span> = <b>" + formatarNumero(estado.sin) + "</b><br>cos " + formatarNumero(estado.ang) + "° = <b>" + formatarNumero(estado.cos) + "</b>";
      },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 480");
        const tempo = Date.now() / 1000;
        const xOrigem = 90, yOrigem = 390, comprimento = 240;
        const anguloRad = (estado.ang * Math.PI) / 180;
        const xA = xOrigem + Math.cos(anguloRad) * comprimento, yA = yOrigem - Math.sin(anguloRad) * comprimento;
        const xB = xOrigem + Math.cos(anguloRad) * comprimento, yB = yOrigem;
        const varredura = anguloRad * ((tempo * 0.6) % 1);
        const xBolinha = xOrigem + 34 * Math.cos(varredura), yBolinha = yOrigem - 34 * Math.sin(varredura);
        svg.innerHTML =
          '<polygon points="' + xOrigem + "," + yOrigem + " " + xB + "," + yOrigem + " " + xA + "," + yA + '" fill="rgba(34,197,94,0.12)"/>' +
          '<line x1="' + xOrigem + '" y1="' + yOrigem + '" x2="' + xA + '" y2="' + yA + '" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>' +
          '<line x1="' + xOrigem + '" y1="' + yOrigem + '" x2="' + xB + '" y2="' + yB + '" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>' +
          '<line x1="' + xA + '" y1="' + yA + '" x2="' + xB + '" y2="' + yB + '" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M ' + (xOrigem + 34) + " " + yOrigem + " A 34 34 0 0 1 " + (xOrigem + 34 * Math.cos(anguloRad)).toFixed(2) + " " + (yOrigem - 34 * Math.sin(anguloRad)).toFixed(2) + '" fill="none" stroke="#f59e0b" stroke-width="2.5"/>' +
          '<circle cx="' + xBolinha.toFixed(1) + '" cy="' + yBolinha.toFixed(1) + '" r="5.5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>' +
          '<text x="' + (xOrigem + 48) + '" y="' + (yOrigem - 16) + '" font-size="15" font-weight="800" ' + contornoPreto("#fbbf24") + ">θ = " + formatarNumero(estado.ang) + "°</text>" +
          '<text x="' + ((xOrigem + xB) / 2) + '" y="' + (yOrigem + 26) + '" text-anchor="middle" font-size="15" font-weight="800" ' + contornoPreto("#60a5fa") + ">cos θ = " + formatarNumero(estado.cos) + "</text>" +
          '<text x="' + (xB + 20) + '" y="' + ((yA + yB) / 2) + '" text-anchor="start" font-size="15" font-weight="800" ' + contornoPreto("#f87171") + ">sen θ = " + formatarNumero(estado.sin) + "</text>" +
          '<text x="' + ((xOrigem + xA) / 2 + 8) + '" y="' + ((yOrigem + yA) / 2) + '" text-anchor="start" font-size="14" font-weight="800" ' + contornoPreto("#4ade80") + ">hipotenusa = 1</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
