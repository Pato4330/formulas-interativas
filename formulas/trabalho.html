<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trabalho · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Trabalho",
      descricao: "O trabalho da força paralela ao deslocamento: W = F·d.",
      formula: "W = F·d",
      cor: "#ef4444",
      sempre: true,
      campos: [
        { chave: "forca", rotulo: "Força (F)", cor: "#3b82f6", min: 0, max: 100, passo: 1, padrao: 50 },
        { chave: "deslocamento", rotulo: "Deslocamento (d)", cor: "#ef4444", min: 0, max: 10, passo: 0.5, padrao: 4 }
      ],
      calcular(estado) { estado.trabalho = estado.forca * estado.deslocamento; },
      textoAoVivo(estado) { return "W = <span class=\"b\">" + formatarNumero(estado.forca) + "</span> · <span class=\"a\">" + formatarNumero(estado.deslocamento) + "</span> = <b>" + formatarNumero(estado.trabalho) + " J</b>"; },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 360");
        const tempo = Date.now() / 1000;
        const chao = 280, xCaixa = 120, yCaixa = chao - 60, larguraCaixa = 80, alturaCaixa = 60;
        const comprimentoSeta = Math.min(estado.forca / 100, 1) * 170;
        const deslocamentoMax = Math.min(estado.deslocamento / 10, 1) * 240;
        const deslocamentoAtual = (Math.sin(tempo * 0.7) * 0.5 + 0.5) * deslocamentoMax;
        const xCaixaAtual = xCaixa + deslocamentoAtual;
        const xSetaInicio = xCaixa + larguraCaixa, xSetaFim = xCaixa + larguraCaixa + deslocamentoAtual;
        svg.innerHTML =
          '<line x1="40" y1="' + chao + '" x2="460" y2="' + chao + '" stroke="#cbd5e1" stroke-width="3"/>' +
          '<line x1="' + xSetaInicio + '" y1="' + chao + '" x2="' + xSetaFim + '" y2="' + chao + '" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>' +
          '<line x1="' + xSetaInicio + '" y1="' + (chao + 10) + '" x2="' + xSetaFim + '" y2="' + (chao + 10) + '" stroke="#f59e0b" stroke-width="4"/>' +
          '<polygon points="' + xSetaFim + "," + (chao + 10) + " " + (xSetaFim - 12) + "," + (chao + 4) + " " + (xSetaFim - 12) + "," + (chao + 16) + '" fill="#f59e0b"/>' +
          '<rect x="' + xCaixaAtual + '" y="' + yCaixa + '" width="' + larguraCaixa + '" height="' + alturaCaixa + '" rx="8" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="3"/>' +
          '<text x="' + (xCaixaAtual + larguraCaixa / 2) + '" y="' + (yCaixa + alturaCaixa / 2 + 5) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#f87171") + ">F = " + formatarNumero(estado.forca) + " N</text>" +
          '<text x="' + (xCaixa + larguraCaixa / 2) + '" y="' + (chao + 30) + '" text-anchor="middle" font-size="14" font-weight="700" ' + contornoPreto("#4ade80") + ">d = " + formatarNumero(estado.deslocamento) + " m</text>" +
          '<text x="' + (xCaixa + larguraCaixa / 2) + '" y="' + (yCaixa - 14) + '" text-anchor="middle" font-size="16" font-weight="800" ' + contornoPreto("#fbbf24") + ">W = " + formatarNumero(estado.trabalho) + " J</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
