<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distância entre Dois Pontos · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Distância entre Dois Pontos",
      categoria: "Matemática",
      descricao: "d = √((x₂ − x₁)² + (y₂ − y₁)²). Mova os dois pontos no plano.",
      formula: "d = √(Δx² + Δy²)",
      cor: "#f59e0b",
      sempre: true,
      campos: [
        { chave: "x1", rotulo: "Ponto A — x", cor: "#3b82f6", min: -8, max: 8, passo: 0.5, padrao: 1 },
        { chave: "y1", rotulo: "Ponto A — y", cor: "#3b82f6", min: -8, max: 8, passo: 0.5, padrao: 2 },
        { chave: "x2", rotulo: "Ponto B — x", cor: "#ef4444", min: -8, max: 8, passo: 0.5, padrao: 6 },
        { chave: "y2", rotulo: "Ponto B — y", cor: "#ef4444", min: -8, max: 8, passo: 0.5, padrao: 5 }
      ],
      calcular(estado) { estado.dx = estado.x2 - estado.x1; estado.dy = estado.y2 - estado.y1; estado.d = Math.hypot(estado.dx, estado.dy); },
      textoAoVivo(estado) {
        return "d = √(" + formatarNumero(estado.dx) + "² + " + formatarNumero(estado.dy) + "²) = <b>" + formatarNumero(estado.d) + "</b>";
      },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 500");
        const tempo = Date.now() / 1000;
        const plano = planoCartesiano(-9, 9, -9, 9);
        const xA = plano.xParaPixels(estado.x1), yA = plano.yParaPixels(estado.y1), xB = plano.xParaPixels(estado.x2), yB = plano.yParaPixels(estado.y2);
        const fracaoAnimacao = (Math.sin(tempo * 0.9) + 1) / 2;
        const pontoX = xA + (xB - xA) * fracaoAnimacao, pontoY = yA + (yB - yA) * fracaoAnimacao;
        svg.innerHTML = plano.grade +
          '<line x1="' + xA + '" y1="' + yA + '" x2="' + xB + '" y2="' + yB + '" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 5"/>' +
          '<line x1="' + xA + '" y1="' + yA + '" x2="' + xB + '" y2="' + yA + '" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 3"/>' +
          '<line x1="' + xB + '" y1="' + yA + '" x2="' + xB + '" y2="' + yB + '" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3"/>' +
          '<circle cx="' + xA + '" cy="' + yA + '" r="7" fill="#3b82f6" stroke="#fff" stroke-width="2"/>' +
          '<text x="' + xA + '" y="' + (yA - 12) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#60a5fa") + ">A</text>" +
          '<circle cx="' + xB + '" cy="' + yB + '" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>' +
          '<text x="' + xB + '" y="' + (yB - 12) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#f87171") + ">B</text>" +
          '<circle cx="' + pontoX.toFixed(1) + '" cy="' + pontoY.toFixed(1) + '" r="6" fill="#fbbf24" stroke="#0b1020" stroke-width="1.5"/>' +
          '<text x="' + ((xA + xB) / 2) + '" y="' + ((yA + yB) / 2 - 10) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#fbbf24") + ">d = " + formatarNumero(estado.d) + "</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
