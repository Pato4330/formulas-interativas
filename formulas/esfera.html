<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área e Volume da Esfera · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Área e Volume da Esfera",
      categoria: "Matemática",
      descricao: "A = 4πr² e V = ⁴⁄₃πr³. Gire o raio e veja a esfera crescer.",
      formula: "A = 4πr² · V = 4πr³/3",
      cor: "#06b6d4",
      sempre: true,
      campos: [
        { chave: "r", rotulo: "Raio (r)", cor: "#06b6d4", min: 1, max: 10, passo: 0.5, padrao: 3 }
      ],
      calcular(estado) { estado.A = 4 * Math.PI * estado.r * estado.r; estado.V = (4 / 3) * Math.PI * estado.r * estado.r * estado.r; },
      textoAoVivo(estado) {
        return "A = 4π·" + formatarNumero(estado.r) + "² = <b>" + formatarNumero(estado.A) + "</b> · V = ⁴⁄₃π·" + formatarNumero(estado.r) + "³ = <b>" + formatarNumero(estado.V) + "</b>";
      },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 420");
        const tempo = Date.now() / 1000;
        const raio = 40 + limitar(estado.r, 1, 10) * 16;
        const centroX = 250, centroY = 180, raioAchatado = raio * 0.55;
        const angulo = tempo * 0.9;
        const pontoX = centroX + Math.cos(angulo) * raio, pontoY = centroY - Math.sin(angulo) * raioAchatado;
        svg.innerHTML =
          '<ellipse cx="' + centroX + '" cy="' + centroY + '" rx="' + raio + '" ry="' + raio + '" fill="rgba(6,182,212,0.25)" stroke="#06b6d4" stroke-width="3"/>' +
          '<ellipse cx="' + centroX + '" cy="' + centroY + '" rx="' + raio + '" ry="' + raioAchatado + '" fill="none" stroke="rgba(6,182,212,0.5)" stroke-width="1.5" stroke-dasharray="4 4"/>' +
          '<line x1="' + (centroX - raio) + '" y1="' + centroY + '" x2="' + (centroX + raio) + '" y2="' + centroY + '" stroke="#22d3ee" stroke-width="2"/>' +
          '<circle cx="' + pontoX.toFixed(1) + '" cy="' + pontoY.toFixed(1) + '" r="6" fill="#4ade80" stroke="#0b1020" stroke-width="1.5"/>' +
          '<text x="' + centroX + '" y="' + (centroY - raioAchatado - 14) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#67e8f9") + ">r = " + formatarNumero(estado.r) + "</text>" +
          '<text x="' + centroX + '" y="' + (centroY + raio + 34) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#93c5fd") + ">A = " + formatarNumero(estado.A) + "</text>" +
          '<text x="' + centroX + '" y="' + (centroY + raio + 62) + '" text-anchor="middle" font-size="14" font-weight="800" ' + contornoPreto("#4ade80") + ">V = " + formatarNumero(estado.V) + "</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
