<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Força Elétrica (Coulomb) · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Força Elétrica (Coulomb)",
      descricao: "F = k·q₁·q₂/d² com k = 9×10⁹. Cargas iguais se repelem.",
      formula: "F = k·q₁·q₂ / d²",
      cor: "#f97316",
      sempre: true,
      campos: [
        { chave: "carga1", rotulo: "Carga 1 (q₁)", cor: "#3b82f6", min: 1, max: 10, passo: 1, padrao: 5 },
        { chave: "carga2", rotulo: "Carga 2 (q₂)", cor: "#ef4444", min: 1, max: 10, passo: 1, padrao: 5 },
        { chave: "distancia", rotulo: "Distância (d)", cor: "#f59e0b", min: 2, max: 20, passo: 1, padrao: 8 }
      ],
      calcular(estado) { estado.forca = (9e9 * estado.carga1 * estado.carga2) / (estado.distancia * estado.distancia); },
      textoAoVivo(estado) { return "F = 9×10⁹·" + formatarNumero(estado.carga1) + "·" + formatarNumero(estado.carga2) + " / " + formatarNumero(estado.distancia) + "² = <b>" + formatarNumero(estado.forca) + " N</b>"; },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 360");
        const tempoAnimacao = Date.now() / 1000;
        const distancia = limitar(estado.distancia, 2, 20);
        const escala = 230 / 20, raioCarga = 16;
        const metadeDistancia = (distancia * escala) / 2;
        const xCarga1 = 250 - metadeDistancia, xCarga2 = 250 + metadeDistancia;
        const yCarga1 = 180 + Math.sin(tempoAnimacao * 1.6) * 3, yCarga2 = 180 - Math.sin(tempoAnimacao * 1.6 + 1) * 3;
        const espaco = xCarga2 - raioCarga - xCarga1 - raioCarga;
        const afastamentoFlecha = Math.max(espaco - 16, 0);
        const opacidade = (0.75 + 0.25 * Math.sin(tempoAnimacao * 3)).toFixed(2);
        let desenho =
          '<circle cx="' + xCarga1 + '" cy="' + yCarga1.toFixed(1) + '" r="' + raioCarga + '" fill="rgba(59,130,246,0.4)" stroke="#3b82f6" stroke-width="2.5"/>' +
          '<text x="' + xCarga1 + '" y="' + (yCarga1 + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="800" fill="#93c5fd">+</text>' +
          '<text x="' + xCarga1 + '" y="' + (yCarga1 + raioCarga + 20).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#93c5fd">q₁ = ' + formatarNumero(estado.carga1) + "</text>" +
          '<circle cx="' + xCarga2 + '" cy="' + yCarga2.toFixed(1) + '" r="' + raioCarga + '" fill="rgba(239,68,68,0.4)" stroke="#ef4444" stroke-width="2.5"/>' +
          '<text x="' + xCarga2 + '" y="' + (yCarga2 + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="800" fill="#fca5a5">+</text>' +
          '<text x="' + xCarga2 + '" y="' + (yCarga2 + raioCarga + 20).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fca5a5">q₂ = ' + formatarNumero(estado.carga2) + "</text>" +
          '<text x="250" y="162" text-anchor="middle" font-size="13" font-weight="700" ' + contornoPreto("#fbbf24") + ">d = " + formatarNumero(estado.distancia) + "</text>";
        if (afastamentoFlecha > 0) {
          desenho +=
            '<line x1="' + (xCarga1 - raioCarga - 6) + '" y1="' + yCarga1.toFixed(1) + '" x2="' + (xCarga1 - raioCarga - 6 - afastamentoFlecha).toFixed(1) + '" y2="' + yCarga1.toFixed(1) + '" stroke="#60a5fa" stroke-width="3" opacity="' + opacidade + '"/>' +
            '<polygon points="' + (xCarga1 - raioCarga - 6 - afastamentoFlecha).toFixed(1) + "," + yCarga1.toFixed(1) + " " + (xCarga1 - raioCarga - 4 - afastamentoFlecha).toFixed(1) + "," + (yCarga1 - 6).toFixed(1) + " " + (xCarga1 - raioCarga - 4 - afastamentoFlecha).toFixed(1) + "," + (yCarga1 + 6).toFixed(1) + '" fill="#60a5fa" opacity="' + opacidade + '"/>' +
            '<line x1="' + (xCarga2 + raioCarga + 6) + '" y1="' + yCarga2.toFixed(1) + '" x2="' + (xCarga2 + raioCarga + 6 + afastamentoFlecha).toFixed(1) + '" y2="' + yCarga2.toFixed(1) + '" stroke="#f87171" stroke-width="3" opacity="' + opacidade + '"/>' +
            '<polygon points="' + (xCarga2 + raioCarga + 6 + afastamentoFlecha).toFixed(1) + "," + yCarga2.toFixed(1) + " " + (xCarga2 + raioCarga + 4 + afastamentoFlecha).toFixed(1) + "," + (yCarga2 - 6).toFixed(1) + " " + (xCarga2 + raioCarga + 4 + afastamentoFlecha).toFixed(1) + "," + (yCarga2 + 6).toFixed(1) + '" fill="#f87171" opacity="' + opacidade + '"/>';
        }
        desenho += '<text x="250" y="' + (180 + 46) + '" text-anchor="middle" font-size="16" font-weight="800" ' + contornoPreto("#4ade80") + ">F = " + formatarNumero(estado.forca) + " N</text>";
        svg.innerHTML = desenho;
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
