<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lei de Ohm · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Lei de Ohm",
      descricao: "A corrente é a razão entre a tensão e a resistência: I = U / R.",
      formula: "U = R·I",
      cor: "#22c55e",
      sempre: true,
      campos: [
        { chave: "U", rotulo: "Tensão (U)", cor: "#22c55e", min: 1, max: 120, passo: 1, padrao: 12 },
        { chave: "R", rotulo: "Resistência (R)", cor: "#f59e0b", min: 1, max: 100, passo: 1, padrao: 10 }
      ],
      calcular(estado) { estado.I = estado.U / estado.R; },
      textoAoVivo(estado) { return "I = <span class=\"c\">" + formatarNumero(estado.U) + "</span> / <span class=\"b\">" + formatarNumero(estado.R) + "</span> = <b>" + formatarNumero(estado.I) + " A</b>"; },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 380");
        const tempo = Date.now() / 1000;
        const xOrigem = 120, yOrigem = 120, largura = 260, altura = 130;
        const comprimentoZiguezague = (largura - 80) / 6;
        let caminhoZiguezague = "", pxAtual = xOrigem + 40;
        for (let i = 0; i < 6; i++) {
          const xx = xOrigem + 40 + (i + 1) * comprimentoZiguezague;
          const yy = yOrigem - (i % 2 ? 26 : 0);
          caminhoZiguezague += (i ? "L" : "M") + xx.toFixed(1) + " " + yy;
        }
        const centroX = xOrigem + largura / 2;
        let resultado =
          '<rect x="' + xOrigem + '" y="' + yOrigem + '" width="' + largura + '" height="' + altura + '" fill="none" stroke="#64748b" stroke-width="2"/>' +
          '<line x1="' + xOrigem + '" y1="' + (yOrigem + altura / 2 - 22) + '" x2="' + xOrigem + '" y2="' + (yOrigem + altura / 2 + 22) + '" stroke="#22c55e" stroke-width="4"/>' +
          '<line x1="' + (xOrigem - 8) + '" y1="' + (yOrigem + altura / 2 - 9) + '" x2="' + (xOrigem + 8) + '" y2="' + (yOrigem + altura / 2 - 9) + '" stroke="#22c55e" stroke-width="3"/>' +
          '<line x1="' + (xOrigem - 8) + '" y1="' + (yOrigem + altura / 2 + 9) + '" x2="' + (xOrigem + 8) + '" y2="' + (yOrigem + altura / 2 + 9) + '" stroke="#22c55e" stroke-width="3"/>' +
          '<text x="' + (xOrigem - 8) + '" y="' + (yOrigem + altura / 2 - 34) + '" text-anchor="middle" font-size="13" font-weight="800" ' + contornoPreto("#4ade80") + ">U = " + formatarNumero(estado.U) + " V</text>" +
          '<path d="' + caminhoZiguezague + '" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<text x="' + centroX + '" y="' + (yOrigem - 36) + '" text-anchor="middle" font-size="13" font-weight="800" ' + contornoPreto("#fbbf24") + ">R = " + formatarNumero(estado.R) + " Ω</text>" +
          '<line x1="' + (centroX - 30) + '" y1="' + (yOrigem + altura / 2) + '" x2="' + (centroX + 30) + '" y2="' + (yOrigem + altura / 2) + '" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>' +
          '<polygon points="' + (centroX + 30) + "," + (yOrigem + altura / 2) + " " + (centroX + 20) + "," + (yOrigem + altura / 2 - 6) + " " + (centroX + 20) + "," + (yOrigem + altura / 2 + 6) + '" fill="#60a5fa"/>' +
          '<text x="' + (centroX + 34) + '" y="' + (yOrigem + altura / 2 + 5) + '" font-size="14" font-weight="800" ' + contornoPreto("#60a5fa") + ">I = " + formatarNumero(estado.I) + " A</text>";
        const perimetro = 2 * (largura + altura);
        const velocidade = 0.08 + Math.min(estado.I, 12) * 0.35;
        const qtdPontos = 5;
        const posicaoNaBorda = (fracao) => {
          let distancia = (fracao * perimetro) % perimetro;
          const segmentos = [
            [xOrigem, yOrigem, xOrigem + largura, yOrigem],
            [xOrigem + largura, yOrigem, xOrigem + largura, yOrigem + altura],
            [xOrigem + largura, yOrigem + altura, xOrigem, yOrigem + altura],
            [xOrigem, yOrigem + altura, xOrigem, yOrigem]
          ];
          for (const segmento of segmentos) {
            const comprimentoSegmento = Math.hypot(segmento[2] - segmento[0], segmento[3] - segmento[1]);
            if (distancia <= comprimentoSegmento) { const fator = distancia / comprimentoSegmento; return [segmento[0] + (segmento[2] - segmento[0]) * fator, segmento[1] + (segmento[3] - segmento[1]) * fator]; }
            distancia -= comprimentoSegmento;
          }
          return [xOrigem, yOrigem];
        };
        for (let indice = 0; indice < qtdPontos; indice++) {
          const fracao = (tempo * velocidade + indice / qtdPontos) % 1;
          const ponto = posicaoNaBorda(fracao);
          resultado +=
            '<circle cx="' + ponto[0].toFixed(1) + '" cy="' + ponto[1].toFixed(1) + '" r="7" fill="rgba(253,224,71,0.22)"/>' +
            '<circle cx="' + ponto[0].toFixed(1) + '" cy="' + ponto[1].toFixed(1) + '" r="4" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>';
        }
        svg.innerHTML = resultado;
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
