<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lei de Hooke (Mola) · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Lei de Hooke (Mola)",
      descricao: "F = k·x. Quanto mais estica a mola, maior a força.",
      formula: "F = k·x",
      cor: "#22c55e",
      sempre: true,
      campos: [
        { chave: "constante", rotulo: "Constante (k)", cor: "#22c55e", min: 1, max: 20, passo: 1, padrao: 5 },
        { chave: "deformacao", rotulo: "Deformação (x)", cor: "#f59e0b", min: 0, max: 10, passo: 0.5, padrao: 3 }
      ],
      calcular(estado) { estado.forca = estado.constante * estado.deformacao; },
      textoAoVivo(estado) { return "F = " + formatarNumero(estado.constante) + "·" + formatarNumero(estado.deformacao) + " = <b>" + formatarNumero(estado.forca) + " N</b>"; },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 500 420");
        const tempoAnimacao = Date.now() / 1000;
        const constante = limitar(estado.constante, 1, 20), deformacao = limitar(estado.deformacao, 0, 10);
        const xParede = 44, yMola = 150, comprimento = 120 + deformacao * 16;
        const amplitude = 34, espiras = 7, segmento = comprimento / espiras;
        const xBola = xParede + 16 + comprimento;
        const oscilacao = Math.sin(tempoAnimacao * 3.2) * 2.5;
        let espirasSvg = "";
        for (let i = 0; i < espiras; i++) {
          const xInicio = xParede + 16 + segmento * i;
          espirasSvg += '<line x1="' + xInicio + '" y1="' + yMola + '" x2="' + (xInicio + segmento / 2) + '" y2="' + (yMola - amplitude) + '" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>' +
            '<line x1="' + (xInicio + segmento / 2) + '" y1="' + (yMola - amplitude) + '" x2="' + (xInicio + segmento) + '" y2="' + yMola + '" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>';
        }
        svg.innerHTML =
          '<rect x="' + (xParede - 12) + '" y="80" width="14" height="140" fill="#475569"/>' +
          '<line x1="' + xParede + '" y1="' + yMola + '" x2="' + (xParede + 16) + '" y2="' + yMola + '" stroke="#94a3b8" stroke-width="2"/>' +
          espirasSvg +
          '<rect x="' + xBola + '" y="' + (yMola - 20 + oscilacao) + '" width="74" height="40" rx="6" fill="rgba(34,197,94,0.4)" stroke="#22c55e" stroke-width="3"/>' +
          '<line x1="' + xBola + '" y1="' + (yMola + 60 + oscilacao) + '" x2="' + (xBola + deformacao * 10) + '" y2="' + (yMola + 60 + oscilacao) + '" stroke="#f59e0b" stroke-width="3"/>' +
          '<polygon points="' + (xBola + deformacao * 10) + ',' + (yMola + 60 + oscilacao) + ' ' + (xBola + deformacao * 10 - 10) + ',' + (yMola + 55 + oscilacao) + ' ' + (xBola + deformacao * 10 - 10) + ',' + (yMola + 65 + oscilacao) + '" fill="#f59e0b"/>' +
          '<text x="' + (xBola + deformacao * 10) + '" y="' + (yMola + 84 + oscilacao) + '" text-anchor="middle" font-size="13" font-weight="800" ' + contornoPreto("#fbbf24") + ">x = " + formatarNumero(deformacao) + "</text>" +
          '<text x="' + (xBola + 37) + '" y="' + (yMola + 46 + oscilacao) + '" text-anchor="middle" font-size="13" font-weight="800" ' + contornoPreto("#4ade80") + ">F = " + formatarNumero(estado.forca) + " N</text>";
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
