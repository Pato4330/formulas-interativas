<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do Círculo · Fórmulas Interativas</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <main id="app"></main>
  <script src="../js/utilitarios.js"></script>
  <script>
    "use strict";
    const formula = {
      titulo: "Área do Círculo",
      categoria: "Matemática",
      descricao: "Área A = πr² e comprimento C = 2πr em função do raio.",
      formula: "A = πr² · C = 2πr",
      cor: "#3b82f6",
      sempre: true,
      campos: [
        { chave: "r", rotulo: "Raio (r)", cor: "#3b82f6", min: 0, max: 10, passo: 0.1, padrao: 3 }
      ],
      calcular(estado) {
        estado.A = Math.PI * estado.r * estado.r;
        estado.C = 2 * Math.PI * estado.r;
      },
      textoAoVivo(estado) {
        return "A = π · " + formatarNumero(estado.r) + "² = <b>" + formatarNumero(estado.A) + "</b><br>C = 2π · " + formatarNumero(estado.r) + " = <b>" + formatarNumero(estado.C) + "</b>";
      },
      desenhar(svg, estado) {
        svg.setAttribute("viewBox", "0 0 480 480");
        const tempo = Date.now() / 1000;
        const centroX = 240, centroY = 240, escala = 210 / 10, raio = limitar(estado.r, 0, 10) * escala;
        const angulo = tempo * 0.8;
        let saida =
          '<circle cx="' + centroX + '" cy="' + centroY + '" r="' + raio + '" fill="rgba(96,165,250,0.15)" stroke="#3b82f6" stroke-width="3"/>';
        if (raio > 0) {
          saida += '<line x1="' + centroX + '" y1="' + centroY + '" x2="' + (centroX + raio) + '" y2="' + centroY + '" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4"/>';
          saida += '<text x="' + (centroX + raio / 2) + '" y="' + (centroY - 14) + '" text-anchor="middle" font-size="16" font-weight="800" ' + contornoPreto("#fbbf24") + ">r = " + formatarNumero(estado.r) + "</text>";
          saida += '<line x1="' + centroX + '" y1="' + centroY + '" x2="' + (centroX + Math.cos(angulo) * raio).toFixed(1) + '" y2="' + (centroY - Math.sin(angulo) * raio).toFixed(1) + '" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>';
          saida += '<circle cx="' + (centroX + Math.cos(angulo) * raio).toFixed(1) + '" cy="' + (centroY - Math.sin(angulo) * raio).toFixed(1) + '" r="6.5" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>';
        }
        saida += '<circle cx="' + centroX + '" cy="' + centroY + '" r="4.5" fill="#fff"/>';
        svg.innerHTML = saida;
      }
    };
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
