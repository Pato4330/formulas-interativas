<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fórmulas Interativas — Matemática & Física</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    min-height: 100svh;
    display: flex;
    justify-content: center;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(59,130,246,0.20), transparent 60%),
      radial-gradient(800px 500px at 110% 110%, rgba(34,197,94,0.14), transparent 60%),
      radial-gradient(600px 400px at 50% 120%, rgba(239,68,68,0.10), transparent 60%),
      #0b1020;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e5e7eb;
    padding: 24px;
    scroll-behavior: smooth;
  }

  main {
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 26px;
    padding: 28px 40px 36px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    text-align: center;
    max-width: 1180px;
    width: 100%;
    margin: auto;
  }

  #app > * { animation: fadeUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .hero { margin-bottom: 28px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #7dd3fc; margin-bottom: 8px; }
  h1 {
    font-size: 30px; font-weight: 800; letter-spacing: 0.5px;
    background: linear-gradient(90deg, #93c5fd, #86efac);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .sub { font-size: 14px; color: #9ca3af; }

  .section { margin-bottom: 30px; }
  .section h2 {
    font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    color: #7dd3fc; margin-bottom: 14px; text-align: left;
  }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 14px; }

  .card {
    text-align: left;
    background: rgba(11,16,32,0.45);
    border: 1px solid rgba(255,255,255,0.09);
    border-left: 4px solid var(--c, #60a5fa);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    will-change: transform;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .card:hover { transform: translateY(-4px) scale(1.02); border-color: var(--c, #60a5fa); box-shadow: 0 0 0 1px var(--c, #60a5fa), 0 16px 36px rgba(0,0,0,0.45); background: rgba(11,16,32,0.7); }
  .card:active { transform: scale(0.97); }
  .card h3 { font-size: 15px; font-weight: 700; color: #f1f5f9; margin-bottom: 6px; }

  .menu-grid .card { animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .menu-grid .card:nth-child(2) { animation-delay: 0.04s; }
  .menu-grid .card:nth-child(3) { animation-delay: 0.08s; }
  .menu-grid .card:nth-child(4) { animation-delay: 0.12s; }
  .menu-grid .card:nth-child(5) { animation-delay: 0.16s; }
  .menu-grid .card:nth-child(6) { animation-delay: 0.2s; }
  .menu-grid .card:nth-child(7) { animation-delay: 0.24s; }
  .menu-grid .card:nth-child(8) { animation-delay: 0.28s; }
  .menu-grid .card:nth-child(9) { animation-delay: 0.32s; }
  .menu-grid .card:nth-child(10) { animation-delay: 0.36s; }
  .card .fix { font-size: 17px; font-weight: 700; color: var(--c, #60a5fa); font-family: "Cambria Math", Georgia, serif; font-style: italic; margin-bottom: 6px; }
  .card p { font-size: 12px; color: #94a3b8; line-height: 1.45; }

  .back {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #cbd5e1;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .back:hover { background: rgba(255,255,255,0.12); color: #fff; }

  .page-head { margin-bottom: 14px; }
  .page-head .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; text-align: left; }
  .page-head h1 { font-size: 24px; }
  #fix {
    font-size: 21px; font-weight: 800; letter-spacing: 3px; font-style: italic;
    font-family: "Cambria Math", Georgia, serif; color: #cbd5e1; margin-top: 4px;
  }

  .live {
    display: inline-block;
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    padding: 9px 20px;
    background: rgba(11,16,32,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    line-height: 1.5;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    margin-bottom: 14px;
  }
  .live b { color: #facc15; }
  .live .a { color: #60a5fa; }
  .live .b { color: #f87171; }
  .live .c { color: #4ade80; }

  .layout { margin-top: 4px; }
  svg { display: block; width: 100%; max-width: 640px; height: auto; margin: 0 auto; }

  #controls { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }

  .control {
    flex: 1 1 230px;
    max-width: 270px;
    display: grid;
    grid-template-columns: 1fr auto 74px;
    align-items: center;
    gap: 2px 12px;
    padding: 14px 16px 12px;
    background: rgba(11,16,32,0.45);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    text-align: left;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .control:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); transform: translateY(-2px); }
  .control label { font-size: 13px; font-weight: 700; color: #cbd5e1; }
  .control output { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; color: var(--accent); text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); }
  .control .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .control input[type="number"] {
    width: 100%; padding: 6px 8px; font-size: 14px; font-weight: 700;
    font-variant-numeric: tabular-nums; text-align: center; color: #f9fafb;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .control input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .control input[type="number"]::-webkit-inner-spin-button, .control input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .control input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

  .control input[type="range"] {
    -webkit-appearance: none; appearance: none;
    grid-column: 1 / -1; width: 100%; height: 6px; border-radius: 999px;
    outline: none; margin-top: 8px; cursor: pointer;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(255,255,255,0.12) var(--p, 0%));
  }
  .control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
    box-shadow: 0 0 12px var(--accent), 0 2px 6px rgba(0,0,0,0.4); cursor: grab; transition: transform 0.12s ease;
  }
  .control input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .control input[type="range"]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.05); }
  .control input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 12px var(--accent); cursor: grab; }

  .control[data-side="a"] { --accent: #3b82f6; }
  .control[data-side="b"] { --accent: #ef4444; }
  .control[data-side="c"] { --accent: #22c55e; }

  @media (min-width: 900px) and (orientation: landscape) {
    body.page-mode { height: 100svh; overflow: hidden; padding: 16px; }
    body.page-mode main { height: calc(100svh - 32px); max-height: calc(100svh - 32px); display: flex; flex-direction: column; padding: 20px 34px 22px; overflow: hidden; }
    .page-head { flex: none; margin-bottom: 10px; }
    .layout { flex: 1; min-height: 0; margin-top: 0; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); grid-template-rows: minmax(0, 1fr); gap: 0 44px; }
    .stage { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
    svg { height: 100%; width: auto; max-width: 100%; max-height: 100%; }
    .panel { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
    #controls { flex-direction: column; align-items: stretch; gap: 10px; }
    .control { max-width: none; width: 100%; max-height: 88px; padding: 10px 14px 9px; }
    .control label { font-size: 12px; }
    .control output { font-size: 18px; min-width: 48px; }
    .control input[type="range"] { margin-top: 4px; height: 5px; }
    .control input[type="range"]::-webkit-slider-thumb { width: 16px; height: 16px; }
    .control input[type="number"] { padding: 5px 6px; font-size: 13px; }
  }

  @media (max-width: 720px) {
    body { padding: 14px; }
    main { padding: 24px 18px 30px; border-radius: 22px; }
    h1 { font-size: 23px; }
    .menu-grid { grid-template-columns: 1fr; }
    .page-head h1 { font-size: 20px; }
    .live { font-size: 15px; padding: 8px 14px; }
    #fix { font-size: 18px; }
    svg { max-width: 100%; }
    #controls { flex-direction: column; align-items: stretch; gap: 12px; }
    .control { max-width: none; width: 100%; }
  }
</style>
</head>
<body>
<main id="app"></main>

<script>
  const $ = (id) => document.getElementById(id);
  const app = $("app");

  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function supExp(exp) {
    const neg = exp < 0 ? "⁻" : "";
    return neg + String(Math.abs(exp)).split("").map((d) => SUP[Number(d)]).join("");
  }
  function sci(n) {
    const parts = n.toExponential(2).split("e");
    return parts[0].replace(".", ",") + "×10" + supExp(Number(parts[1]));
  }
  const fmt = (n) => {
    if (!isFinite(n)) return String(n);
    if (n === 0) return "0";
    const a = Math.abs(n);
    if (a >= 1e5 || a < 1e-3) return sci(n);
    const s = Math.round(n * 100) / 100;
    return Number.isInteger(s) ? String(s) : String(s);
  };
  const pct = (v, min, max) => ((v - min) / (max - min)) * 100;
  const sign = (n) => (n < 0 ? "− " + fmt(Math.abs(n)) : "+ " + fmt(n));
  const halo = (c) => 'stroke="#0b1020" stroke-width="6" paint-order="stroke" fill="' + c + '"';

  function planeSVG(xmin, xmax, ymin, ymax) {
    const W = 500, H = 500, M = 38;
    const sx = (W - 2 * M) / (xmax - xmin), sy = (H - 2 * M) / (ymax - ymin);
    const X = (x) => M + (x - xmin) * sx;
    const Y = (y) => (H - M) - (y - ymin) * sy;
    let g = "";
    for (let x = Math.ceil(xmin); x <= Math.floor(xmax); x++)
      g += '<line x1="' + X(x).toFixed(2) + '" y1="' + M + '" x2="' + X(x).toFixed(2) + '" y2="' + (H - M) + '" stroke="rgba(148,163,184,0.10)"/>';
    for (let y = Math.ceil(ymin); y <= Math.floor(ymax); y++)
      g += '<line x1="' + M + '" y1="' + Y(y).toFixed(2) + '" x2="' + (W - M) + '" y2="' + Y(y).toFixed(2) + '" stroke="rgba(148,163,184,0.10)"/>';
    g += '<line x1="' + M + '" y1="' + Y(0).toFixed(2) + '" x2="' + (W - M) + '" y2="' + Y(0).toFixed(2) + '" stroke="#cbd5e1" stroke-width="2"/>';
    g += '<line x1="' + X(0).toFixed(2) + '" y1="' + M + '" x2="' + X(0).toFixed(2) + '" y2="' + (H - M) + '" stroke="#cbd5e1" stroke-width="2"/>';
    for (let x = Math.ceil(xmin); x <= Math.floor(xmax); x++) {
      if (x === 0) continue;
      g += '<text x="' + X(x).toFixed(2) + '" y="' + (Y(0) + 18) + '" text-anchor="middle" font-size="11" fill="#94a3b8">' + x + "</text>";
    }
    for (let y = Math.ceil(ymin); y <= Math.floor(ymax); y++) {
      if (y === 0) continue;
      g += '<text x="' + (X(0) - 7) + '" y="' + (Y(y) + 4).toFixed(2) + '" text-anchor="end" font-size="11" fill="#94a3b8">' + y + "</text>";
    }
    return { g, X, Y };
  }

  const PAGES = {};

  PAGES.pythagoras = {
    title: "Teorema de Pitágoras",
    cat: "Matemática",
    desc: "No triângulo retângulo, o quadrado da hipotenusa é igual à soma dos quadrados dos catetos.",
    fix: "a² + b² = c²",
    color: "#3b82f6",
    fields: [
      { key: "a", label: "Cateto A", color: "#3b82f6", min: 0, max: 100, step: 0.1, def: 3 },
      { key: "b", label: "Cateto B", color: "#ef4444", min: 0, max: 100, step: 0.1, def: 4 },
      { key: "c", label: "Hipotenusa", color: "#22c55e", min: 0, max: 142, step: 0.1, def: 5 }
    ],
    fieldApply: {
      c: (s, v) => {
        const cur = Math.hypot(s.a, s.b);
        if (cur <= 0) { const t = clamp(v, 0, 142) / Math.SQRT2; s.a = t; s.b = t; }
        else { const k = clamp(v, 0, 142) / cur; s.a = Math.min(s.a * k, 100); s.b = Math.min(s.b * k, 100); }
      }
    },
    update(s) { s.c = Math.hypot(s.a, s.b); },
    live(s) { return '<span class="a">' + fmt(s.a) + "²</span> + <span class=\"b\">" + fmt(s.b) + "²</span> = <span class=\"c\">" + fmt(s.c) + "²</span>"; },
    draw(svg, s) {
      const SIZE = 704, SCALE = 30, MAX = 20, PAD = 52;
      svg.setAttribute("viewBox", "0 0 " + SIZE + " " + SIZE);
      const oy = PAD + MAX * SCALE;
      const scale = (MAX * SCALE) / Math.max(s.a, s.b, 1e-9);
      const ax = PAD + s.a * scale, ay = oy;
      const by = oy - s.b * scale;
      const mx = (ax + PAD) / 2, my = (ay + by) / 2;
      const q = 14;
      svg.innerHTML =
        '<polygon points="' + PAD + "," + oy + " " + ax + "," + ay + " " + PAD + "," + by + '" fill="rgba(96,165,250,0.14)"/>' +
        '<line x1="' + PAD + '" y1="' + oy + '" x2="' + ax + '" y2="' + ay + '" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>' +
        '<line x1="' + PAD + '" y1="' + oy + '" x2="' + PAD + '" y2="' + by + '" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>' +
        '<line x1="' + ax + '" y1="' + ay + '" x2="' + PAD + '" y2="' + by + '" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>' +
        '<polyline points="' + PAD + "," + oy + " " + (PAD + q) + "," + oy + " " + (PAD + q) + "," + (oy - q) + " " + PAD + "," + (oy - q) + '" fill="none" stroke="#9ca3af" stroke-width="2.5"/>' +
        '<text x="' + (PAD + s.a * scale / 2) + '" y="' + (oy + 26) + '" text-anchor="middle" font-size="19" font-weight="800" ' + halo("#60a5fa") + ">" + fmt(s.a) + "</text>" +
        '<text x="' + (PAD - 14) + '" y="' + ((oy + by) / 2 + 6) + '" text-anchor="end" font-size="19" font-weight="800" ' + halo("#f87171") + ">" + fmt(s.b) + "</text>" +
        '<text x="' + (mx - 18) + '" y="' + (my - 18) + '" text-anchor="middle" font-size="19" font-weight="800" ' + halo("#4ade80") + ">" + fmt(s.c) + "</text>";
    }
  };

  PAGES.linear = {
    title: "Função Linear",
    cat: "Matemática",
    desc: "y = ax + b. Deslize o coeficiente angular e o termo independente para ver a reta mudar.",
    fix: "y = ax + b",
    color: "#ef4444",
    fields: [
      { key: "a", label: "Coef. angular (a)", color: "#ef4444", min: -5, max: 5, step: 0.1, def: 2 },
      { key: "b", label: "Termo b", color: "#3b82f6", min: -5, max: 5, step: 0.1, def: 1 }
    ],
    live(s) { return "y = <span class=\"a\">" + fmt(s.a) + "</span>x <span class=\"b\">" + sign(s.b) + "</span>"; },
    draw(svg, s) {
      svg.setAttribute("viewBox", "0 0 500 500");
      const p = planeSVG(-6, 6, -8, 8);
      let xs = [-6, 6];
      const at = (y) => (s.a !== 0 ? (y - s.b) / s.a : null);
      const push = (v) => { if (v !== null && v >= -6 && v <= 6) xs.push(v); };
      push(at(-8)); push(at(8));
      const lo = Math.min(...xs), hi = Math.max(...xs);
      const y0 = s.a * lo + s.b, y1 = s.a * hi + s.b;
      let out = p.g;
      out += '<line x1="' + p.X(lo) + '" y1="' + p.Y(y0) + '" x2="' + p.X(hi) + '" y2="' + p.Y(y1) + '" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>';
      if (s.b >= -8 && s.b <= 8) {
        out += '<circle cx="' + p.X(0) + '" cy="' + p.Y(s.b) + '" r="5" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>';
        out += '<text x="' + (p.X(0) - 10) + '" y="' + (p.Y(s.b) - 10) + '" text-anchor="end" font-size="13" font-weight="700" ' + halo("#60a5fa") + ">(0, " + fmt(s.b) + ")</text>";
      }
      const yx = s.a + s.b;
      if (yx >= -8 && yx <= 8) {
        out += '<circle cx="' + p.X(1) + '" cy="' + p.Y(yx) + '" r="5.5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>';
        out += '<text x="' + (p.X(1) + 10) + '" y="' + (p.Y(yx) - 10) + '" font-size="13" font-weight="700" ' + halo("#f59e0b") + ">(1, " + fmt(yx) + ")</text>";
      }
      svg.innerHTML = out;
    }
  };

  PAGES.quadratic = {
    title: "Função Quadrática",
    cat: "Matemática",
    desc: "y = ax² + bx + c. Veja a parábola, o vértice e as raízes mudarem ao vivo.",
    fix: "y = ax² + bx + c",
    color: "#f59e0b",
    fields: [
      { key: "a", label: "Coef. a", color: "#f59e0b", min: -3, max: 3, step: 0.1, def: 1 },
      { key: "b", label: "Coef. b", color: "#ef4444", min: -6, max: 6, step: 0.1, def: -2 },
      { key: "c", label: "Coef. c", color: "#3b82f6", min: -6, max: 6, step: 0.1, def: -3 }
    ],
    fieldApply: {
      a: (s, v) => { s.a = v < 0 ? clamp(v, -3, -0.1) : clamp(v, 0.1, 3); }
    },
    update(s) { s.delta = s.b * s.b - 4 * s.a * s.c; },
    live(s) {
      let txt = "y = <span class=\"a\">" + fmt(s.a) + "</span>x² " +
        '<span class="b">' + sign(s.b) + "</span>x " +
        '<span class="c">' + sign(s.c) + "</span><br>Δ = " + fmt(s.delta);
      if (s.delta >= 0) {
        const r1 = (-s.b - Math.sqrt(s.delta)) / (2 * s.a);
        const r2 = (-s.b + Math.sqrt(s.delta)) / (2 * s.a);
        txt += "<br>x₁ = " + fmt(r1) + ", x₂ = " + fmt(r2);
      }
      return txt;
    },
    draw(svg, s) {
      svg.setAttribute("viewBox", "0 0 500 500");
      const p = planeSVG(-7, 7, -12, 12);
      let path = "", pen = false;
      const N = 90;
      for (let i = 0; i <= N; i++) {
        const x = -7 + (14 * i) / N;
        const y = s.a * x * x + s.b * x + s.c;
        const ok = y >= -12 && y <= 12;
        if (ok) { path += (pen ? "L" : "M") + p.X(x).toFixed(2) + " " + p.Y(y).toFixed(2); pen = true; }
        else pen = false;
      }
      let out = p.g;
      out += '<path d="' + path + '" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>';
      const xv = -s.b / (2 * s.a), yv = s.a * xv * xv + s.b * xv + s.c;
      if (xv >= -7 && xv <= 7 && yv >= -12 && yv <= 12) {
        out += '<circle cx="' + p.X(xv) + '" cy="' + p.Y(yv) + '" r="5.5" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>';
        out += '<text x="' + (p.X(xv) + 12) + '" y="' + (p.Y(yv) - 8) + '" font-size="13" font-weight="700" ' + halo("#fbbf24") + ">vértice (" + fmt(xv) + ", " + fmt(yv) + ")</text>";
      }
      if (s.delta >= 0) {

      "</div>" +
      '<div class="layout"><div class="stage"><svg id="viz"></svg></div>' +
      '<div class="panel"><div id="live" class="live"></div><div id="controls"></div></div></div>';

    const host = $("controls");
    for (const f of p.fields) {
      const card = document.createElement("div");
      card.className = "control";
      card.style.setProperty("--accent", f.color);
      card.innerHTML =
        '<label><span class="dot"></span>' + f.label + "</label>" +
        '<output></output>' +
        '<input type="number" min="' + f.min + '" max="' + f.max + '" step="' + f.step + '" inputmode="decimal">' +
        '<input type="range" min="' + f.min + '" max="' + f.max + '" step="' + f.step + '">';
      const out = card.querySelector("output");
      const num = card.querySelector("input[type=number]");
      const slider = card.querySelector("input[type=range]");
      const apply = (v) => {
        if (p.fieldApply && p.fieldApply[f.key]) p.fieldApply[f.key](state, v);
        else state[f.key] = clamp(v, f.min, f.max);
        if (p.update) p.update(state);
        needsDraw = true;
        syncPage();
      };
      slider.addEventListener("input", () => apply(Number(slider.value)));
      num.addEventListener("change", () => apply(Number(num.value) || 0));
      f._el = { out, num, slider };
      host.appendChild(card);
    }

    syncPage();
    needsDraw = true;
    $("viz").setAttribute("viewBox", "0 0 640 640");
    p.draw($("viz"), disp);
    rafId = requestAnimationFrame(loop);
  }

  function syncPage() {
    for (const f of current.fields) {
      const v = state[f.key];
      const el = f._el;
      el.slider.value = v;
      el.num.value = fmt(v);
      el.out.textContent = fmt(v);
      el.slider.style.setProperty("--p", pct(v, f.min, f.max) + "%");
    }
    $("live").innerHTML = current.live(state);
  }

  function loop() {
    if (current) {
      let anim = false;
      for (const k in disp) {
        if (Math.abs(state[k] - disp[k]) > 0.02) {
          disp[k] += (state[k] - disp[k]) * 0.35;
          anim = true;
        } else {
          disp[k] = state[k];
        }
      }
      if (anim || needsDraw) {
        needsDraw = false;
        current.draw($("viz"), disp);
      }
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
    }
  }

  function navigate() {
    const id = location.hash.replace("#", "");
    if (id && PAGES[id]) showPage(id);
    else showMenu();
  }

  window.addEventListener("hashchange", navigate);
  navigate();
  loop();
</script>
</body>
</html>
